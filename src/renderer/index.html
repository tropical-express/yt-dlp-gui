<!DOCTYPE html>
<html>
<head>
  <title>yt-dlp GUI</title>
  <style>
    body {
      font-family: Arial;
      background: #121212;
      color: white;
      padding: 20px;
      max-width: 600px;
      margin: auto;
    }

    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
    }

    button {
      background: #2ecc71;
      border: none;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #27ae60;
    }

    #progressBar {
      width: 100%;
      height: 20px;
      background: #333;
      margin-top: 15px;
    }

    #progressFill {
      height: 100%;
      width: 0%;
      background: #2ecc71;
    }

    #status {
      margin-top: 10px;
      font-weight: bold;
    }

    #folder {
      font-size: 12px;
      color: #aaa;
      margin-top: 5px;
    }

    #log {
      margin-top: 10px;
      height: 150px;
      overflow: auto;
      background: black;
      padding: 10px;
      font-size: 12px;
    }
  </style>
</head>

<body>

<h2>yt-dlp GUI</h2>

<input id="url" placeholder="Paste video URL" />

<button onclick="pickFolder()">Choose Download Folder</button>
<div id="folder">No folder selected</div>

<button onclick="startDownload()">Download</button>

<div id="progressBar">
  <div id="progressFill"></div>
</div>

<div id="status">Idle</div>

<div id="log"></div>

<script src="renderer.js"></script>
</body>
</html>
